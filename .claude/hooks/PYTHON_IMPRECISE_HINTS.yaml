# Every imprecise Python type hint the Claude Code hook kit holds, and the ratchet
# that keeps the list from growing. A hint is universally quantified, so `str`,
# `list[float]` or `dict[str, X]` claims the code handles any string, any list of
# floats, any key, which it does not. The one checker is aletheia's
# tools/check_precise_hints.py, run over this directory with --root and --record
# by tests/check_hints.sh before every commit, and on every edit by
# precise-hints-guard.py; it refuses an imprecise hint this file does not name,
# and a row naming more hints than its file holds.
#
# A hint is imprecise when it holds `Any` or `object`, or a generic given no
# parameters; `str`, `int`, `float` or `bytes` anywhere; three or more nested
# subscripts; or when it is an alias, a NewType over a shape, or the type a cast
# names, holding any of these. A row leaves this file by the change that types its
# hints. Adding a row needs the user's approval, and a row a foreign interface
# forces carries a `reason:`. Rows are keyed by file, relative to this directory,
# and by the hint's own text; `count` is how many hints in that file share it.

