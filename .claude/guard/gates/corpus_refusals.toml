# The corpus commands bash accepts and the pinned shell reader refuses, each with the reason the refusal stands.
# A row is the command's key (the sha256 of its text: the corpus stays out of every repository), the reader's
# message as it refuses it, and why. corpus_gate.py fails on a refusal no row records with the same message, so a
# new pin that refuses another command, or the same one for another reason, needs a row of its own.

