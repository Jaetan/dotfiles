# The plants that show rules/ignored_declaration.py and declarations/ignored.py held by tests/test_ignored_declaration.py:
#   testing/plants.py tests/plants_ignored_declaration.toml --out DIR
# The plant on state/session.py holds the claim that the note is said once per claude process, which rests on the
# state's key: with every process in one folder, a second process hears nothing.

[[plant]]
name = "the rule does not judge SessionStart"
file = "rules/ignored_declaration.py"
old = 'EVENTS: frozenset[HookEvent] = frozenset({"SessionStart", "PreToolUse"})'
new = 'EVENTS: frozenset[HookEvent] = frozenset({"PreToolUse"})'
tests = ["tests.test_ignored_declaration.Ignored.test_a_folder_rule_is_named_at_session_start"]

[[plant]]
name = "the rule does not judge a call"
file = "rules/ignored_declaration.py"
old = 'EVENTS: frozenset[HookEvent] = frozenset({"SessionStart", "PreToolUse"})'
new = 'EVENTS: frozenset[HookEvent] = frozenset({"SessionStart"})'
tests = ["tests.test_ignored_declaration.Ignored.test_a_call_from_inside_the_work_tree_names_it"]

