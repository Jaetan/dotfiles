# The plants that show dispatcher/notices.py is held by tests/test_notices.py and tests/test_payload.py: run
#   testing/plants.py tests/plants_notices.toml --out DIR
# Every plant is killed when each line of dispatcher/notices.py they break is held by a test.

[[plant]]
name = "the task id pattern matches no notice"
file = "dispatcher/notices.py"
old = 'TASK = re.compile(r"<task-id>([^<]*)</task-id>")'
new = 'TASK = re.compile(r"<task-id>([^<]*)</task-ix>")'
tests = ["tests.test_notices.Notices.test_each_ending_status_ends_its_task"]

[[plant]]
name = "the status pattern matches no status"
file = "dispatcher/notices.py"
old = 'STATUS = re.compile(r"<status>([^<]*)</status>")'
new = 'STATUS = re.compile(r"<status>([^<]*)</statux>")'
tests = ["tests.test_notices.Notices.test_each_ending_status_ends_its_task"]

