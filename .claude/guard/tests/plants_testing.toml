# The plants that show the testing module's tests hold its code: run
#   testing/plants.py tests/plants_testing.toml --out DIR
# Every plant is killed when each line of testing/runner.py and testing/plants.py they break is held by a test.

[[plant]]
name = "the runner accepts a temporary folder inside a git tree"
file = "testing/runner.py"
old = 'if (tree := tree_holding(base)) is not None:'
new = 'if (tree := None) is not None:'
tests = ["tests.test_runner.Refusals.test_temporary_folder_in_a_git_tree"]

[[plant]]
name = "the in-tree check reads the temporary folder alone, not the folders holding it"
file = "testing/runner.py"
old = 'for d in (path, *path.parents) if'
new = 'for d in (path,) if'
tests = ["tests.test_runner.Refusals.test_temporary_folder_in_a_git_tree"]

