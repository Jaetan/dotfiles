# The plants that show the call model's loops are held by tests/test_model.py: run
#   testing/plants.py tests/plants_loops.toml --out DIR
# Every plant is killed when each line of dispatcher/model.py that places a command in the loops it runs inside is
# held by a test, as is each line of dispatcher/python.py reading the loops of Python code that sleep and of
# dispatcher/model.py giving them to the interpreter's command, with whether the code sleeps outside them.

[[plant]]
name = "a loop's identifier is its kind"
file = "dispatcher/model.py"
old = '''    loop: LoopId
    kind: LoopKind
'''
new = '''    kind: LoopKind
    loop: LoopId
'''
tests = ["tests.test_model.Loops.test_a_while"]

[[plant]]
name = "a loop's kind is the part holding the command"
file = "dispatcher/model.py"
old = '''    kind: LoopKind
