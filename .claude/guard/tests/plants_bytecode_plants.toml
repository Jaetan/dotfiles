name = "the rule judges another event"
file = "rules/bytecode_plants.py"
old = 'frozenset({"PreToolUse"})'
new = 'frozenset({"PostToolUse"})'
tests = ["tests.test_bytecode_plants.Rule.test_a_shell_write_and_a_test_run"]

